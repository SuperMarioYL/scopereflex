<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="ScopeReflex architecture: Agent Plan → Contraction Engine → Diff Renderer → Acceptance Gate → Contracted Plan">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- Static connector lines (under the marching dashes) -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="68"  x2="350" y2="68"  marker-end="url(#ah-d)"/>
    <line x1="530" y1="68"  x2="670" y2="68"  marker-end="url(#ah-d)"/>
    <line x1="760" y1="100" x2="760" y2="140" marker-end="url(#ah-d)"/>
    <line x1="760" y1="204" x2="760" y2="244" marker-end="url(#ah-d)"/>
  </g>

  <!-- Marching-dash data flow (infinite loop, direction = data direction) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="68"  x2="346" y2="68"  stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="68"  x2="666" y2="68"  stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="760" y1="100" x2="760" y2="136" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="760" y1="204" x2="760" y2="240" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Data-packet dots traveling each connector -->
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M210,68 L346,68" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M530,68 L666,68" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M760,100 L760,136" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M760,204 L760,240" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Nodes (breathing fill-opacity, staggered negative begin) -->
  <g>
    <rect x="30"  y="36"  width="180" height="64" rx="15" fill="#4DA3FF" fill-opacity="0.10" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="120" y="73" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">Agent Plan</text>
    <text x="120" y="89" text-anchor="middle" font-size="10" fill="#A1A1A8">JSON / Markdown</text>

    <rect x="350" y="36"  width="180" height="64" rx="15" fill="#8985FF" fill-opacity="0.10" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="73" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">Contraction Engine</text>
    <text x="440" y="89" text-anchor="middle" font-size="10" fill="#A1A1A8">deterministic rules</text>

    <rect x="670" y="36"  width="180" height="64" rx="15" fill="#2DC79A" fill-opacity="0.10" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="760" y="73" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">Diff Renderer</text>
    <text x="760" y="89" text-anchor="middle" font-size="10" fill="#A1A1A8">structural diff</text>

    <rect x="670" y="140" width="180" height="64" rx="15" fill="#8985FF" fill-opacity="0.10" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.5s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="760" y="177" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">Acceptance Gate</text>
    <text x="760" y="193" text-anchor="middle" font-size="10" fill="#A1A1A8">accept / edit / reject</text>

    <rect x="670" y="244" width="180" height="64" rx="15" fill="#2DC79A" fill-opacity="0.10" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="760" y="281" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">Contracted Plan</text>
    <text x="760" y="297" text-anchor="middle" font-size="10" fill="#A1A1A8">.contracted.json</text>
  </g>
</svg>
