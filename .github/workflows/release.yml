name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Pack into dist/
        run: |
          mkdir -p dist
          npm pack --pack-destination ./dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tgz > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Optional npm publish — gated behind the NPM_PUBLISH repo variable so a
  # fresh repo (no token configured) never fails a release with a red job.
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
